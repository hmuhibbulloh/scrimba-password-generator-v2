<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
    <title>Random Password Generator</title>
  </head>
  <body>
    <div class="hero">
      <h1>Generate a <span class="highlight">random password</span></h1>
      <p>Never use an insecure password again.</p>
      <div class="options">
        <label for="length">Length</label>
        <select id="length" name="length">
          <option value="6">6</option>
          <option selected value="8">8</option>
          <option value="15">15</option>
        </select>
        <br />
        <label for="digits">Include digits</label>
        <input id="digits" name="digits" type="checkbox" />
        <br />
        <label for="chars">Include special characters</label>
        <input id="chars" name="chars" type="checkbox" />
      </div>
      <button class="btn">Generate passwords</button>
      <hr />
      <div class="passwords">
        <p class="password password--1"></p>
        <p class="password password--2"></p>
      </div>
    </div>
  </body>
</html>
